#build/push image + update GitOps repo
name: ci

on:
  push:
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build_push_update_gitops:
    runs-on: ubuntu-latest
    env:
      ECR_REPO: ${{ vars.ECR_REPO_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE=${{ steps.login-ecr.outputs.registry }}/${ECR_REPO}:${IMAGE_TAG}
          docker build -t $IMAGE ./app
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update gitops repo with new image tag
        env:
          GITOPS_REPO: git@github.com:YOURORG/gitops-repo.git
          GIT_SSH_KEY: ${{ secrets.GITOPS_SSH_KEY }}
        run: |
          mkdir -p /tmp/gitops && cd /tmp/gitops
          git clone $GITOPS_REPO .
          cd charts/threat-composer
          # use yq to set .image.tag
          yq e '.image.tag = strenv(IMAGE_TAG)' -i values.yaml
          git add values.yaml
          git commit -m "ci: bump image to ${IMAGE_TAG}"
          git push origin main
